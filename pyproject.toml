[project]
name = "iisc_theme"
authors = [{ name = "ITChamps Software Pvt Ltd", email = "nusrath@itchamps.com" }]
description = "IISc branded Desk theme for Frappe HR v16"
requires-python = ">=3.14"
readme = "README.md"
